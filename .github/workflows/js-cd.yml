# Publish this repository. Tests for a branch live in js-std-ci.yml and js-os-ci.yml. Pin checks live in js-check-actions.yml.
#
# Publishing is one tag-triggered job with two registries. npm and JSR both
# authenticate with GitHub Actions OIDC (id-token: write); no token is read.
# The npm trusted publisher is configured per package on npmjs.com and must
# name this repository, workflow js-cd.yml, and environment production. The
# JSR package must be linked to neotales/js-lib. Neither is done by this file.
# eng/scripts/publish.mjs preflights every package before the first upload. An
# existing npm version is skipped only on an exact tarball match; an existing
# JSR version is logged and skipped because Deno publishes only unpublished
# versions. See docs/publishing.md.
name: js cd

on:
  push:
    tags:
      - "std/v[0-9]*"
      - "js/v[0-9]*"
      - "os/v[0-9]*"
permissions:
  contents: read

concurrency:
  group: js-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: bun node deno (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Verify the release checkout
        run: node eng/scripts/check-release-ref.mjs

      - name: Check the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            std/v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-r.[0-9]*) ;;
            js/v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-r.[0-9]*) ;;
            os/v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-r.[0-9]*) ;;
            *)
              echo "js-cd.yml accepts std/vYYYY.MM.DD-r.N, js/vYYYY.MM.DD-r.N, or os/vYYYY.MM.DD-r.N. Got ${RELEASE_TAG}."
              exit 1
              ;;
          esac

      - name: Set up Bun 1.4.4
        if: ${{ !cancelled() }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Set up Node 26.13.0
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Set up Deno 2.9.8
        if: ${{ !cancelled() }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Refuse a package that still contains tests
        run: node eng/scripts/check-publish.mjs

      - name: Refuse a stale ende.json
        run: bun run sync:ende -- --check

      - name: Test the release planner
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node --test eng/scripts/publish.test.mjs

      # A release tag runs every extra step. dev, plab-js-lib, and rt-<runtime> do too.
      - name: Install pinned Linux runtimes
        if: >-
          !cancelled() &&
          matrix.os == 'ubuntu-24.04' &&
          (
            github.ref_type == 'tag' ||
            github.ref_name == 'dev' || github.head_ref == 'dev' ||
            github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
            github.ref_name == 'rt-ende' || github.head_ref == 'rt-ende' ||
            github.ref_name == 'rt-quickjs' || github.head_ref == 'rt-quickjs' ||
            github.ref_name == 'rt-workerd' || github.head_ref == 'rt-workerd' ||
            github.ref_name == 'rt-clearscript' || github.head_ref == 'rt-clearscript'
          )
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          mise_toml: |
            [tools]
            workerd = "1.20261109.1"
            dotnet = "11.0.100-rc.2.26504.105"
            "github:quickjs-ng/quickjs" = { version = "0.18.0", asset_pattern = "qjs-linux-x86_64", bin = "qjs-linux-x86_64" }
            "github:theende/ende" = { version = "2026.11.06", asset_pattern = "ende-x86_64-unknown-linux-gnu.zip", bin = "ende" }

      - name: Install pinned txiki.js 26.11.0
        if: >-
          !cancelled() &&
          matrix.os != 'ubuntu-24.04' &&
          (
            github.ref_type == 'tag' ||
            github.ref_name == 'dev' || github.head_ref == 'dev' ||
            github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
            github.ref_name == 'rt-txiki' || github.head_ref == 'rt-txiki'
          )
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          mise_toml: |
            [tools."github:saghul/txiki.js"]
            version = "26.11.0"
            [tools."github:saghul/txiki.js".platforms]
            macos-arm64 = { asset_pattern = "txiki-macos-arm64.zip", strip_components = 1, bin = "tjs" }
            macos-x64 = { asset_pattern = "txiki-macos-x86_64.zip", strip_components = 1, bin = "tjs" }
            windows-x64 = { asset_pattern = "txiki-windows-x86_64.zip", strip_components = 1, bin = "tjs.exe" }

      # Each lane writes under .build/<lane>, so these can share the runner.
      - parallel:
          - name: Test on Bun
            if: ${{ !cancelled() }}
            run: bun run test

          - name: Test on Node
            if: ${{ !cancelled() }}
            run: bun run test:node

          - name: Test on Deno
            if: ${{ !cancelled() }}
            run: bun run test:deno

          - name: Test on Ende
            if: >-
              !cancelled() &&
              matrix.os == 'ubuntu-24.04' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'dev' || github.head_ref == 'dev' ||
                github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
                github.ref_name == 'rt-ende' || github.head_ref == 'rt-ende'
              )
            run: bun run test:ende

          - name: Test on QuickJS-ng
            if: >-
              !cancelled() &&
              matrix.os == 'ubuntu-24.04' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'dev' || github.head_ref == 'dev' ||
                github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
                github.ref_name == 'rt-quickjs' || github.head_ref == 'rt-quickjs'
              )
            run: bun run test:quickjs

          - name: Test on workerd
            if: >-
              !cancelled() &&
              matrix.os == 'ubuntu-24.04' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'dev' || github.head_ref == 'dev' ||
                github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
                github.ref_name == 'rt-workerd' || github.head_ref == 'rt-workerd'
              )
            run: bun run test:workerd

          - name: Test on ClearScript
            if: >-
              !cancelled() &&
              matrix.os == 'ubuntu-24.04' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'dev' || github.head_ref == 'dev' ||
                github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
                github.ref_name == 'rt-clearscript' || github.head_ref == 'rt-clearscript'
              )
            run: bun run test:clearscript

          - name: Test on txiki.js
            if: >-
              !cancelled() &&
              matrix.os != 'ubuntu-24.04' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'dev' || github.head_ref == 'dev' ||
                github.ref_name == 'plab-js-lib' || github.head_ref == 'plab-js-lib' ||
                github.ref_name == 'rt-txiki' || github.head_ref == 'rt-txiki'
              )
            shell: bash
            run: bun run test:txiki

  publish:
    name: publish
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify the release checkout
        run: node eng/scripts/check-release-ref.mjs

      - name: Set up Node 26.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Set up Deno 2.9.8
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Install pnpm 12.18.0
        run: npm install -g pnpm@12.18.0

      - name: Plan the release (no upload)
        run: node eng/scripts/publish.mjs preflight

      # Re-runs the plan. A version that appeared after preflight is logged as
      # an unverified skip, not reported as a new upload; a real failure stops
      # the run.
      - name: Publish JSR and npm packages
        run: node eng/scripts/publish.mjs publish
